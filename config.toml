# Default cif-parse configuration.
#
# CLI arguments always override values from this file. Supported sections are:
# [settings], [single], and [batch].

[settings]
# Primary export format for per-structure result tables.
# Options: "json", "csv".
output_format = "json"

# Structure coordinate mode used for dimer/multimer/complex analysis.
# Options:
# - "asymmetric_unit": analyze the deposited asymmetric unit directly.
# - "largest_assembly": choose the assembly containing the most polymer chain
#   instances; ties are resolved by the lowest/earliest assembly id.
assembly_mode = "asymmetric_unit"

# Method for assigning observed coordinates to polymer sequence positions.
# Options:
# - "nearest": assign by nearest residue/atom coordinate when direct identifiers
#   are incomplete; recommended default.
# - "contact": contact-aware assignment mode.
# - "covalent": covalent-connectivity-aware assignment mode.
coverage_mode = "nearest"

# JSON export layout switch.
# Options:
# - false: default; write one compact `result.json.gz` bundle containing all JSON artifacts.
# - true: write split JSON artifacts directly under the output directory.
# This option is ignored when `output_format = "csv"`.
debug = false

# Root logging level for CLI, batch parent process, and worker processes.
# Options: "DEBUG", "INFO", "WARNING", "ERROR".
log_level = "INFO"

# Print verbose JSON summaries from CLI commands instead of only output paths.
# Options: true, false.
verbose = false

# 1-based model index to read from multi-model mmCIF files.
# Allowed values: integer >= 1.
model = 1

# Use author coordinate identifiers when reading atom arrays.
# Options:
# - false: use label_asym_id/label_seq_id internally; recommended default.
# - true: use auth_asym_id/auth_seq_id when constructing structure arrays.
use_author_fields = false

# Remove hydrogen atoms before downstream coverage/interface calculations.
# Options:
# - true: heavy-atom-only analysis; recommended default.
# - false: retain hydrogens where present.
drop_hydrogens_for_analysis = true

# Skip structures with more polymer chains than this threshold.
# Allowed values: integer >= 1.
max_polymer_chains = 100

# Skip structures unless at least one polymer chain has length greater than this
# threshold. A value of 0 disables the practical length guard.
# Allowed values: integer >= 0.
min_polymer_chain_length = 20

# Minimum buried area required to keep a dimer edge in the tight-multimer
# graph.
# Allowed values: float >= 0.
tight_multimer_min_buried_area = 10.0

# Resolution parameter for Louvain community detection over the weighted
# tight-multimer graph.
# Allowed values: float > 0.
tight_multimer_louvain_resolution = 1.0

# Minimum community size, counted in instance-level member nodes, for exporting
# a tight multimer.
# Allowed values: integer >= 2.
tight_multimer_min_member_instances = 2

# Emit `large_component_without_bridge_pruning` once a tight multimer reaches
# this many instance-level member nodes.
# Allowed values: integer >= 2.
tight_multimer_large_component_warning_size = 8

# ---------------------------------------------------------------------------
# Contact / interface geometry
# ---------------------------------------------------------------------------

# Distance cutoff (in Angstroms) for residue-level contact detection.
# Two residues are considered in contact when their representative atoms are
# within this distance. This cutoff is used both for the initial bounding-box
# filter and for counting residue-residue contacts across chain pairs.
# Allowed values: float > 0.
residue_contact_cutoff = 8.0

# Distance cutoff (in Angstroms) for atom-level contact detection.
# After a residue-level contact is found, atom-atom distances are checked with
# this stricter cutoff to count actual atomic contacts.
# Allowed values: float > 0.
atom_contact_cutoff = 4.5

# Minimum number of residue-residue contacts required to keep a dimer interface.
# Pairs with fewer contacts are discarded before area calculation.
# Allowed values: integer >= 0.
min_residue_contacts = 3

# Minimum number of atom-atom contacts required to keep a dimer interface.
# Pairs with fewer atomic contacts are discarded before area calculation.
# Allowed values: integer >= 0.
min_atom_contacts = 20

# ---------------------------------------------------------------------------
# Immune annotation thresholds
# ---------------------------------------------------------------------------

# Maximum peptide chain length for TCR-pMHC complex assembly.
# During TCR-pMHC complex identification, candidate chains that are not
# already labeled as peptide antigen are only considered if their sequence
# length is at most this value.
# Allowed values: integer >= 1.
peptide_max_length = 30

# Minimum HMMER bitscore for a Sadie variable-domain hit to be accepted.
# Domains scoring below this threshold are discarded before clustering and
# chain-type assignment.
# Allowed values: float >= 0.
sadie_domain_bitscore_threshold = 80.0

# Maximum number of Sadie variable domains to retain per chain.
# After clustering overlapping hits, at most this many domains are kept,
# ordered by bitscore and preferred chain code.
# Allowed values: integer >= 1.
sadie_domain_limit = 4

# Confidence threshold below which an antibody annotation is flagged as
# low confidence in review outputs.
# Allowed values: float in [0, 1].
low_confidence_antibody_threshold = 0.8

[single]
# Default output directory for `cif-parse single`.
# Allowed values: any writable filesystem path.
outdir = "outputs"

[batch]
# Default output directory for `cif-parse batch`.
# Allowed values: any writable filesystem path.
outdir = "batch_outputs"

# Number of worker processes for `cif-parse batch`.
# Allowed values: integer >= 1.
jobs = 8

# Stop the batch run after the first failed input.
# Options: true, false.
fail_fast = false
